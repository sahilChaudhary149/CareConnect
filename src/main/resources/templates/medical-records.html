<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>CareConnect - Medical Records</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f8fb;
            margin: 0;
        }

        .navbar {
            background: #1976d2;
            color: white;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            color: #1976d2;
        }

        .add {
            display: inline-block;
            padding: 10px 18px;
            background: #1976d2;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th,
        td {
            padding: 14px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #1976d2;
            color: white;
        }

    </style>

</head>

<body>

<div class="navbar">

    <strong>CareConnect</strong>

    <a href="/doctor-dashboard" style="color:white;">
        Dashboard
    </a>

</div>

<div class="container">

    <h1>Medical Records</h1>

    <a href="/add-medical-record" class="add">
        + Add Medical Record
    </a>

    <table>

        <thead>

        <tr>
            <th>ID</th>
            <th>Patient ID</th>
            <th>Doctor ID</th>
            <th>Diagnosis</th>
            <th>Clinical Notes</th>
        </tr>

        </thead>

        <tbody>

        <tr th:each="record : ${records}">

            <td th:text="${record.id}"></td>

            <td th:text="${record.patientId}"></td>

            <td th:text="${record.doctorId}"></td>

            <td th:text="${record.diagnosis}"></td>

            <td th:text="${record.clinicalNotes}"></td>

        </tr>

        </tbody>

    </table>

</div>

</body>

</html>
