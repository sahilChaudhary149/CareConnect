<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>CareConnect - EHR</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
        }

        .container {
            width: 600px;
            margin: 120px auto;
            text-align: center;
            background: white;
            padding: 50px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            color: #0d6efd;
            font-size: 40px;
        }

        p {
            color: #666;
            font-size: 18px;
            line-height: 1.6;
        }

        .button {
            display: inline-block;
            margin: 10px;
            padding: 12px 25px;
            background: #0d6efd;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .button:hover {
            background: #0b5ed7;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>CareConnect</h1>

    <h2>Patient-Provider EHR System</h2>

    <p>
        A simple web-based Electronic Health Record system
        for managing patient records, appointments,
        clinical documentation and prescriptions.
    </p>

    <a href="/login" class="button">
        Login
    </a>

    <a href="/register" class="button">
        Register
    </a>

</div>

</body>

</html>
